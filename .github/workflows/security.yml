name: Security Audit

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
